        /* GLOBAL RESET FOR KIOSK FULLSCREEN FEEL */
        html, body, #root {
            height: 100%;

            overflow: hidden;
            overscroll-behavior: none;

        /* Custom Scrollbar untuk elemen yang boleh di-scroll */

        /* Cross-WebView Animation & Tailwind v4 Compat Utilities */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.985);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out forwards;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            70% {
                opacity: 1;
                transform: scale(1.03);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-bounce-in {
            animation: bounceIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Modern Boot Loader Animations */
        @keyframes orbitSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes orbitSpinReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes shimmerBar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(220%); }
        }

        @keyframes floatPulse {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-4px) scale(1.02); }
        }

        .animate-orbit {
            animation: orbitSpin 2.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        .animate-orbit-reverse {
            animation: orbitSpinReverse 3.2s linear infinite;
        }

        .animate-shimmer-bar {
            animation: shimmerBar 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .animate-float-pulse {
            animation: floatPulse 3s ease-in-out infinite;
        }

        .shadow-xs {
            box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
        }
        .shadow-2xs {
            box-shadow: 0 1px 1px 0 rgba(15, 23, 42, 0.04);
        }
        .rounded-xs {
            border-radius: 2px;
        }
        .backdrop-blur-xs {
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
        }

        /* High-Impact Violation Modal Animation */
        @keyframes violationPop {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(20px);
            }
            65% {
                opacity: 1;
                transform: scale(1.02) translateY(-2px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .animate-violation-pop {
            animation: violationPop 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes hazardPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6), 0 25px 50px -12px rgba(0, 0, 0, 0.8);

            }
        }

        .animate-hazard-pulse {
            animation: hazardPulse 2.2s infinite;
        }
